[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sdcs-red"
version = "0.2.0"
description = "Dual-mode adversarial code audit skill and toolchain for AI agents"
readme = "README.md"
authors = [{ name = "Adam M", email = "adamm@users.noreply.github.com" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py310"
